# Installed as /etc/dpkg/dpkg.cfg.d/pg-collation-check by pg-collation-check's install.sh.
# Refreshes the PostgreSQL collation login warning after every dpkg run, so a glibc or
# PostgreSQL update shows up at once. A failing post-invoke hook would abort dpkg, hence "|| true".
post-invoke=if [ -x /usr/local/sbin/pg-collation-check ]; then /usr/local/sbin/pg-collation-check --quiet --trigger dpkg || true; fi
