// Installed as /etc/apt/apt.conf.d/80login-warnings by install.sh of
// https://github.com/MarcFauser/login-warnings.

// Refresh the package lists once a day. apt-daily.timer starts /usr/lib/apt/apt.systemd.daily
// twice a day anyway, but without an APT::Periodic setting it exits at once. Only the lists
// are downloaded; no package is downloaded or installed.
APT::Periodic::Update-Package-Lists "1";

// Around every apt update, by hand or from apt-daily.service: record when it started and
// whether it reached a repository, then run the login warning checks. apt runs
// Post-Invoke-Success as soon as at least one repository was fetched, then Post-Invoke.
// A failing hook makes apt update fail with "Problem executing scripts", hence "|| true".
APT::Update::Pre-Invoke { "if [ -x /usr/local/sbin/apt-updates-check ]; then /usr/local/sbin/apt-updates-check --stamp start || true; fi"; };
APT::Update::Post-Invoke-Success { "if [ -x /usr/local/sbin/apt-updates-check ]; then /usr/local/sbin/apt-updates-check --stamp success || true; fi"; };
APT::Update::Post-Invoke { "if [ -x /usr/local/sbin/login-warnings ]; then /usr/local/sbin/login-warnings --quiet --trigger apt || true; fi"; };
