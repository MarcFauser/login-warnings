# Installed as /etc/dpkg/dpkg.cfg.d/login-warnings by install.sh of
# https://github.com/MarcFauser/login-warnings.
# Runs the login warning checks after every dpkg run, so a glibc or PostgreSQL update shows up
# at once and installed updates leave the list. A failing post-invoke hook would abort dpkg,
# hence "|| true".
post-invoke=if [ -x /usr/local/sbin/login-warnings ]; then /usr/local/sbin/login-warnings --quiet --trigger dpkg || true; fi
